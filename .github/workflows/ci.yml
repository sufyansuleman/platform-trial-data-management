name: pipeline

# The point of this workflow is to prove the claim the README makes: clone the
# repository, restore the environment, and the whole pipeline runs and passes
# on a machine that has never seen it. Nothing here reads any committed data --
# every dataset is regenerated from the seed in config/trial.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    # Pinned rather than ubuntu-latest. A CI image that changes underneath you
    # is the same class of problem as an unpinned package version, and this
    # repository's whole claim is that a result can be regenerated later.
    runs-on: ubuntu-24.04

    env:
      # renv restores from the lockfile; GITHUB_PAT avoids rate limiting when
      # any package needs to be fetched from GitHub rather than CRAN.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

      # `use-public-rspm` below sets options(repos) for the R session, but renv
      # restores from the repositories recorded in renv.lock, which are
      # cloud.r-project.org and therefore serve source tarballs on Linux. The
      # result was that 58 of 102 packages were compiled on every run, which is
      # how a missing libuv turned into a failed build. This override is the
      # documented way to point renv itself at prebuilt Ubuntu binaries.
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          # Posit Package Manager serves prebuilt Linux binaries. Without it
          # every package compiles from source and the run takes an hour.
          use-public-rspm: true

      # With the binary repository above, nothing here should need to compile.
      # These are the fallbacks for when Posit Package Manager has no binary for
      # a pinned version and renv drops back to source: fs 2.x stopped vendoring
      # libuv, and arrow needs cmake to build the Arrow C++ library. Cheap to
      # install and they turn a hard failure into a slow success.
      - name: Install system dependencies for source fallbacks
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev cmake libxml2-dev libglpk-dev

      - name: Report where packages are coming from
        run: |
          Rscript -e 'message("renv repos override: ", Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))'
          Rscript -e 'print(getOption("repos"))'

      - name: Restore the R environment from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Report the environment actually in use
        run: |
          Rscript -e 'cat("R:", R.version.string, "\n")'
          Rscript -e 'cat("packages restored:", nrow(installed.packages()), "\n")'
          quarto --version

      - name: Run the pipeline
        run: Rscript -e 'targets::tar_make()'

      - name: Run the test suite
        run: Rscript -e 'testthat::test_dir("tests/testthat")'

      - name: Summarise what the pipeline produced
        run: Rscript scripts/pipeline_summary.R

      - name: Render the monitoring reports
        run: Rscript scripts/render_reports.R

      - name: Upload the pipeline summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: build/
          if-no-files-found: ignore

      - name: Package the reports for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishing matters: it means anyone reading the repository can click a link
  # and see the actual monitoring report rather than take a screenshot's word
  # for it. Only the default branch is published.
  publish:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
