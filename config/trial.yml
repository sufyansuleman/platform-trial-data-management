# ---------------------------------------------------------------------------
# Trial configuration for the synthetic adaptive platform trial.
#
# Every tunable quantity in the simulation lives in this file. Code in R/ must
# not contain literal parameters -- if a number matters, it belongs here.
#
# All sites, names and identifiers are INVENTED. See README disclaimer.
# ---------------------------------------------------------------------------

trial:
  id: SYNTH-PLATFORM-01
  name: Synthetic Adaptive Platform Trial in Critical Illness
  seed: 20260820                 # master seed; same seed in, identical data out

# --- Enrolment window -------------------------------------------------------
enrolment:
  start_date: 2024-01-08
  months: 24
  target_participants: 2500
  enrolled_fraction: 0.70        # fraction of screened patients who are randomised
  ramp_up_months: 6              # linear ramp from ramp_floor to full rate
  ramp_floor: 0.25               # fraction of full monthly rate in month 1
  seasonal_multipliers:          # by calendar month, 1 = January
    1: 1.00
    2: 1.00
    3: 1.05
    4: 1.00
    5: 0.95
    6: 0.85
    7: 0.70                      # summer dip
    8: 0.75
    9: 1.00
    10: 1.05
    11: 1.05
    12: 0.75                     # December dip

# --- Domains ----------------------------------------------------------------
# Three domains run concurrently over a shared participant population.
domains:
  - id: FLUID
    name: Fluid resuscitation strategy
    arms: [restrictive, liberal]
    allocation_ratio: [1, 1]
    eligibility_fraction: 0.75    # of randomised participants eligible for it
  - id: ANTICOAG
    name: Anticoagulation intensity
    arms: [standard_dose, intermediate_dose]
    allocation_ratio: [1, 1]
    eligibility_fraction: 0.45
  - id: BUFFER
    name: Buffered versus non-buffered solution
    arms: [buffered, saline]
    allocation_ratio: [1, 1]
    eligibility_fraction: 0.40

# Mean randomisations per participant. Deliberately > 1: multi-domain
# participation is what creates the cross-domain consistency problems.
multi_domain:
  target_randomisations_per_participant: 1.2

# --- Countries --------------------------------------------------------------
# Local conventions differ by country. The ingest layer must normalise these
# and log every transformation it applies.
countries:
  DK:
    name: Denmark
    date_format: "%d-%m-%Y"
    decimal_separator: "."
    weight_unit: kg
    creatinine_unit: umol/L
    encoding: UTF-8
  NL:
    name: Netherlands
    date_format: "%d-%m-%Y"
    decimal_separator: ","
    weight_unit: kg
    creatinine_unit: umol/L
    encoding: UTF-8
  SE:
    name: Sweden
    date_format: "%Y-%m-%d"
    decimal_separator: "."
    weight_unit: kg
    creatinine_unit: umol/L
    encoding: UTF-8
  FI:
    name: Finland
    date_format: "%Y-%m-%d"
    decimal_separator: ","
    weight_unit: kg
    creatinine_unit: umol/L
    encoding: UTF-8
  IS:
    name: Iceland
    date_format: "%d-%m-%Y"
    decimal_separator: "."
    weight_unit: kg
    creatinine_unit: umol/L
    encoding: UTF-8

