# --- Clinical process model -------------------------------------------------
# The aim is a plausible clinical process, not random noise: severity drives
# length of stay, life-support use and mortality, and support tapers over time.
clinical:
  max_follow_up_days: 90         # daily_icu records span day 0..90
  outcome_window_days: 30        # primary outcome horizon

  age:      {mean: 63, sd: 15, min: 18, max: 95}
  weight_kg: {mean: 78, sd: 16, min: 38, max: 180}
  female_fraction: 0.42

  # Severity index, modelled on an APACHE-II-like 0-71 scale.
  severity: {mean: 22, sd: 8, min: 0, max: 71}

  # ICU length of stay, lognormal, truncated at max_follow_up_days.
  icu_los: {meanlog: 1.55, sdlog: 0.85}

  # 30-day mortality via logistic model on centred severity.
  # Intercept chosen to give roughly 30-40% overall mortality.
  mortality:
    intercept: -0.72
    severity_coefficient: 0.055
    severity_centre: 22
    # Deaths cluster early; mean days from randomisation to death among those
    # who die within the outcome window.
    mean_days_to_death: 8

  # Probability of each life support on ICU day 0, as a logistic function of
  # severity, then tapering multiplicatively with each further day.
  # `persistence` is the probability of continuing support given it was given
  # yesterday. Without it, independent daily draws produce implausibly
  # fragmented on/off patterns, which would distort the derived endpoint.
  # `intercept` and `severity_coefficient` set the probability of STARTING a
  # support on ICU day 0. `daily_taper` reduces the chance of starting it for
  # the first time on later days. `persistence` is the probability of
  # continuing once started, which makes episode length geometric with mean
  # 1 / (1 - persistence) -- so persistence is calibrated against typical
  # episode duration, shown in the comment beside each value.
  life_support:
    mechanical_ventilation:
      intercept: -1.03            # ~65% ventilated on day 0 at median severity
      severity_coefficient: 0.075
      daily_taper: 0.80
      persistence: 0.85           # mean episode ~6.7 days
    vasopressors:
      intercept: -1.14            # ~60% on day 0 at median severity
      severity_coefficient: 0.070
      daily_taper: 0.78
      persistence: 0.72           # mean episode ~3.6 days
    renal_replacement:
      intercept: -3.31            # ~12% on day 0 at median severity
      severity_coefficient: 0.060
      daily_taper: 0.90
      persistence: 0.90           # mean episode ~10 days

  # Inter-ICU transfer (a participant moves between ICU locations mid-stay).
  transfer_probability: 0.06

  # ICU readmission after discharge alive, within the follow-up window.
  readmission_probability: 0.05

  # Adverse events: low base rate, per participant per ICU day.
  adverse_events:
    daily_rate: 0.060
    serious_fraction: 0.30
    related_fraction: 0.25
    codes: [AE-BLEED, AE-THROMB, AE-INFECT, AE-ARRHY, AE-AKI,
            AE-HYPOT, AE-ALLERG, AE-PNEU, AE-DELIR, AE-HYPER]

# --- Data entry timeliness --------------------------------------------------
# Days between the clinical event and its entry into the EDC.
timeliness:
  baseline_median_days: 3
  baseline_sd_days: 2.5
  max_delay_days: 120
  holiday_entry_delay_days: 3    # extra delay when entry falls near a local holiday
  holiday_window_days: 2         # a date within this many days of a holiday counts

# --- Defect injection -------------------------------------------------------
# Known data-quality problems deliberately introduced after the clean dataset
# is generated. Ground truth is written to data/interim/injected_defects.parquet
# so the validation engine's recall can be measured per defect type.
#
# `expected_rule_id` is the rule that SHOULD detect the defect. Where it is
# `~` (null), no deterministic rule can catch it -- it is a statistical signal
# for central monitoring (Milestone 3), and counting it against rule recall
# would be dishonest.
defects:
  # -- Missingness ----------------------------------------------------------
  - id: D01
    name: missing_required_field
    description: Required field left blank at entry.
    forms: [screening, randomisation, daily_icu, outcome_30d]
    base_rate: 0.012                # all sites
    site_rates: {DK-11: 0.140}      # one site far worse than the rest
    expected_rule_id: STR-001

  - id: D02
    name: missing_daily_record_gap
    description: >
      One or more daily_icu records absent from the MIDDLE of an ICU stay,
      leaving a gap rather than truncating the record.
    participant_rate: 0.035
    gap_length_days: [1, 3]
    expected_rule_id: LOG-001

  # -- Implausible values ---------------------------------------------------
  - id: D03
    name: out_of_range_value
    description: Physiologically impossible values entered.
    participant_rate: 0.006
    # Each variant names the rule that should catch it. They differ: an
    # implausible weight is RNG-001, an implausible heart rate is RNG-002.
    # Tagging them all with one rule id understated recall badly on first run.
    variants:
      - {form: screening, field: weight_kg,     value: 8,   expected_rule_id: RNG-001}
      - {form: daily_icu, field: heart_rate,    value: 400, expected_rule_id: RNG-002}
      - {form: daily_icu, field: temperature_c, value: 12,  expected_rule_id: RNG-003}
    expected_rule_id: RNG-001

  - id: D11
    name: unit_conversion_failure
    description: >
      Weight measured in pounds but submitted as kilograms, at a site whose
      declared unit is kg. Values are ~2.2x too high.
    sites: [FI-01]
    rate: 0.25
    multiplier: 2.20462
    expected_rule_id: RNG-001

  # -- Date and sequence problems -------------------------------------------
  - id: D04
    name: impossible_date_sequence
    description: Discharge recorded before ICU admission.
    participant_rate: 0.012
    shift_days: [-9, -1]
    expected_rule_id: TMP-001

  - id: D05
    name: ae_before_randomisation
    description: Adverse event onset recorded before randomisation.
    event_rate: 0.030
    shift_days: [-14, -1]
    expected_rule_id: TMP-004

  # -- Identity and linkage -------------------------------------------------
  - id: D06
    name: duplicate_participant_id
    description: Same participant ID issued at two different sites.
    n_pairs: 6
    expected_rule_id: STR-003

  - id: D07
    name: double_randomisation_same_domain
    description: One participant randomised twice within the same domain.
    n_participants: 8
    expected_rule_id: STR-004

  # -- Cross-form logic -----------------------------------------------------
  - id: D08
    name: inconsistent_vital_status
    description: >
      Participant flagged alive on a daily record dated AFTER the recorded
      date of death.
    n_participants: 14
    alive_days_after_death: [1, 5]
    expected_rule_id: LOG-002

  # -- Behavioural / statistical signals ------------------------------------
  # No deterministic rule detects these; they are central-monitoring signals.
  - id: D09
    name: late_entry_drift
    description: >
      Data entry delay worsening steadily over calendar time at one site --
      the key drift signal for central monitoring.
    sites: [SE-02]
    extra_delay_per_month: 1.8      # days added per month since site initiation
    expected_rule_id: ~

  - id: D10
    name: terminal_digit_preference
    description: >
      Continuous measurements rounded to values ending in 0 or 5 far more
      often than chance, indicating estimated rather than measured values.
    sites: [DK-05]
    rate: 0.55
    fields: [heart_rate, weight_kg]
    expected_rule_id: ~

  - id: D12
    name: ae_under_reporting
    description: One site systematically records only a fraction of its AEs.
    sites: [NL-03]
    retention_fraction: 0.35
    expected_rule_id: ~

  # -- Allocation update that never took effect ------------------------------
  - id: D13
    name: allocation_update_not_applied
    description: >
      An interim analysis issues new allocation probabilities. Every site
      applies them except one, whose randomisation system silently continued
      on the previous ratio. The randomisation records at that site still
      carry the NEW ratio in allocation_ratio, because the specification was
      issued to every site: the field records what was meant to be in force,
      not what the system actually did. Nothing errors, no rule fires, and the
      realised split at that site is a perfectly ordinary 1:1. Only comparing
      realised against specified exposes it.
    effective_date: 2024-10-01
    specified_ratio_label: "3:2"
    arm_probabilities:
      FLUID:
        liberal: 0.6
        restrictive: 0.4
      ANTICOAG:
        intermediate_dose: 0.6
        standard_dose: 0.4
      BUFFER:
        buffered: 0.6
        saline: 0.4
    failing_sites: [DK-01]
    expected_rule_id: ~
