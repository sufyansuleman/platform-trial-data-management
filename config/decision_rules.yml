# ---------------------------------------------------------------------------
# Pre-specified decision rules for the adaptive analyses.
#
# These thresholds are fixed BEFORE any analysis is run. They are in
# configuration rather than in code so that the values a decision was made
# under can be read by a committee member, and so that changing one is a
# visible, reviewable, dated act rather than an edit buried in a function.
#
# Every analysis record stamps the version of this file it used.
#
# Companion document: docs/statistical_analysis_plan.md
# ---------------------------------------------------------------------------

version: "1.0"
effective_date: 2026-08-21

# --- Stopping rules ---------------------------------------------------------
# Applied per domain, per arm, at every adaptive analysis.
thresholds:
  superiority: 0.99
  # P(this arm is better than the comparator) above this value stops the
  # domain for superiority.

  inferiority: 0.01
  # P(better) below this value stops the arm for inferiority. Stated as its
  # own threshold rather than as 1 - superiority so that the two can be moved
  # independently: the cost of continuing a harmful arm is not the mirror
  # image of the cost of continuing a beneficial one.

  practical_equivalence: 0.90
  # P(|mean difference| < equivalence_margin) above this value stops the
  # domain for practical equivalence.

  equivalence_margin_days: 1.0
  # A difference smaller than one day alive without life support is not
  # clinically meaningful. See the SAP for why this number and not another.

# --- Adaptive analysis schedule ---------------------------------------------
schedule:
  first_analysis_completed: 1000
  # Participants with completed 30-day follow-up in that domain.

  subsequent_every: 250
  maximum_participants: 10000

# --- Response-adaptive randomisation ----------------------------------------
response_adaptive_randomisation:
  enabled: true
  begins_after_analysis: 1
  # No adaptation before the first analysis: allocation stays fixed until
  # there is evidence to adapt to.

  minimum_allocation: 0.40
  # No arm may fall below this share. The floor exists so that an arm cannot
  # be starved of participants by an early run of chance before the evidence
  # is real.

  update_rule: proportional_to_probability_best
  # Allocation proportional to P(arm is best), then floored and renormalised.

# --- Analysis populations ---------------------------------------------------
populations:
  primary: intention_to_treat
  sensitivity: [complete_case]

# --- What a decision may be -------------------------------------------------
decisions:
  - continue
  - stop_superiority
  - stop_inferiority
  - stop_equivalence
