# ---------------------------------------------------------------------------
# Pre-specified priors.
#
# Stated as numbers, before any data is analysed. The rationale for each is in
# docs/statistical_analysis_plan.md section 5.
#
# The governing distinction, which the SAP explains at length:
#
#   * A prior on the BASELINE event rate may legitimately use existing
#     evidence. How sick this population is, and how often patients like these
#     die, is known from cohorts and from previous trials, and pretending
#     otherwise discards real information.
#
#   * A prior on the TREATMENT EFFECT may not. It is centred on no difference
#     and kept weak, because the trial exists precisely because nobody knows
#     the answer. A prior that favours the treatment manufactures part of the
#     result the trial was run to obtain.
#
# Every analysis record stamps the version of this file it used.
# ---------------------------------------------------------------------------

version: "1.1"
effective_date: 2026-08-21

# CHANGE FROM 1.0. The arm mean prior standard deviation is reduced from 10 to
# 5 days. Version 1.0 failed its own prior predictive check: it placed 14.4% of
# prior mass outside the 0 to 30 day range the outcome can physically take, and
# implied a treatment effect larger than 10 days 48.1% of the time, which no
# critical care intervention has produced.
#
# The amendment is legitimate at this point in the trial for one specific
# reason: a prior predictive check uses NO DATA. It evaluates the prior against
# what is physically and clinically possible, and every input to it was
# available before a single participant was enrolled. Tightening a prior in
# response to it is therefore not a data-dependent choice, which is the thing
# pre-specification exists to prevent.
#
# The decision is unaffected either way. The sensitivity analysis already
# established that all three domains reach the same decision under prior
# standard deviations of 2, 10 and 100 days, a far wider range than this
# amendment moves within.
#
# The version 1.0 analysis record is retained unchanged as a historical
# artefact. See DEC-023a.

# --- Primary outcome: days alive without life support at 30 days ------------
# Modelled as normal with a normal-normal conjugate update. The outcome is
# bounded 0 to 30 and strongly zero-inflated by mortality, so normality is an
# approximation; it is used because the quantity the decision rules read is a
# difference in means, which the central limit theorem makes well behaved at
# the sample sizes involved. See DEC-019.
primary_outcome:
  name: days_alive_without_life_support
  model: normal_normal

  # Prior on each arm's mean. Centred at a value consistent with published
  # critical care cohorts, and wide enough to be dominated by the data after a
  # few dozen participants.
  arm_mean_prior:
    mean: 15.0
    sd: 5.0

  # Prior on the residual standard deviation, held fixed at the pooled
  # estimate rather than given its own prior. See the SAP for why.
  outcome_sd:
    value: 12.0
    estimate_from_data: true
    # When true, the pooled standard deviation observed in the cut is used and
    # the value above is the fallback for a cut too small to estimate it.

  # The prior on the DIFFERENCE between arms is implied by the two arm priors
  # and is centred on zero by construction. Stated explicitly so that its
  # width can be read without deriving it.
  implied_treatment_effect_prior:
    mean: 0.0
    sd: 7.07    # sqrt(5^2 + 5^2)

# --- Secondary outcome: mortality at 30 and 90 days -------------------------
# Beta-binomial conjugate. The posterior is Beta(a + deaths, b + survivors),
# which is exact, deterministic, and explainable in one line.
mortality:
  model: beta_binomial

  # Beta(2, 3) has mean 0.4 and is worth about five prior observations. That
  # matches published 30-day mortality in comparable critically ill
  # populations while remaining weak enough to be overwhelmed immediately.
  arm_prior:
    alpha: 2
    beta: 3

# --- Secondary outcome: days alive out of hospital at 30 days ---------------
days_alive_out_of_hospital:
  model: normal_normal
  arm_mean_prior:
    mean: 12.0
    sd: 10.0
  outcome_sd:
    value: 12.0
    estimate_from_data: true

# --- Prior sets for the sensitivity analysis --------------------------------
# The pre-specified prior above, plus two alternatives. The headline question
# is not what each posterior looks like, but whether the DECISION changes.
sensitivity_priors:
  - id: prespecified
    label: Pre-specified neutral, weakly informative
    description: >
      The prior above. Centred on no difference, wide enough that the data
      dominates quickly.
    arm_mean_sd: 5.0
    mortality_alpha: 2
    mortality_beta: 3

  - id: sceptical
    label: Sceptical
    description: >
      Tight around no difference, so that a large observed effect is pulled
      substantially toward zero. Asks whether the conclusion survives a reader
      who does not believe the treatment works.
    arm_mean_sd: 2.0
    mortality_alpha: 20
    mortality_beta: 30

  - id: vague
    label: Vague
    description: >
      Almost flat. Asks whether the conclusion depends on the prior at all, or
      is driven entirely by the data.
    arm_mean_sd: 100.0
    mortality_alpha: 1
    mortality_beta: 1

# --- Posterior computation --------------------------------------------------
posterior:
  draws: 100000
  # Used only for quantities without a closed form, such as
  # P(|difference| < margin). The draw count is fixed and seeded so that the
  # same cut gives the same number every time -- the reproducibility guarantee
  # in docs/data_cut_sop.md section 7 depends on it.
  seed: 20260821
